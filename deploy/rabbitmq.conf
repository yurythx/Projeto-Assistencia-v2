# consumer_timeout: o RabbitMQ força o fechamento (com precondition_failed)
# do canal de qualquer consumidor que segure uma entrega SEM ack por mais
# tempo que este valor — o fechamento do canal devolve a entrega não-ackada
# pro broker, que a redistribui de novo pra fila (redelivery nativa),
# concorrendo com o retry-com-backoff que a própria aplicação já implementa
# (internal/platform/messaging/consumer.go) por cima disso.
#
# Bug real encontrado nesta base de código (validação de um consumidor de
# job síncrono de longa duração contra um alvo real): o padrão do
# RabbitMQ (1800000ms = 30min) colidiu quase exatamente com o timeout
# configurado do handler mais longo da época (também ~30min) — o handler
# genuinamente ainda rodando aos 30min (nenhum erro, só demorado) fazia o
# RabbitMQ fechar o canal e redistribuir a MESMA entrega enquanto o
# original ainda a processava, gerando dois processamentos concorrentes
# do mesmo job, e o job acabava preso para sempre em "processing".
#
# 3h de folga cobre qualquer consumidor síncrono que um plug-in venha a
# registrar (os consumidores de hoje terminam em milissegundos). Sempre
# que um consumidor de longa duração for adicionado, confirme que o
# timeout dele fica bem abaixo deste valor — os dois nunca podem ficar
# perto um do outro de novo.
consumer_timeout = 10800000
