# O coletor de métricas embutido no plug-in de management
# (management_metrics_collection) está depreciado desde o RabbitMQ 3.13 e
# o broker avisa disso a cada boot. Nenhum código do projeto consulta a API
# HTTP de management (os health checks usam `rabbitmq-diagnostics`), então
# desligar o coletor só tira as taxas/gráficos da UI de management — a UI
# continua listando filas, conexões e contagens de mensagens. Para métricas
# históricas, o caminho recomendado é o plug-in rabbitmq_prometheus.
management_agent.disable_metrics_collector = true
